# Builds and tests the API and both frontends on every pull request, and on main after each merge: the same commands
# as on a developer's machine (docs/testing.md). The actions are pinned to a commit, with the release in a comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The repository's global.json takes any 10.0 SDK from 10.0.100 up, and runs the tests on the Microsoft
      # Testing Platform
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      # Warnings are errors (Directory.Build.props)
      - run: dotnet build --no-restore
      # Unit and integration tests; the integration tests start PostgreSQL 18 in Docker (Testcontainers)
      - run: dotnet test --no-build

  frontend:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Marketing site
            app: marketing
          - name: Staff app
            app: staff
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Type-checks, then builds; the address suggestions' key is optional, so the site builds without it
      - run: npm run build
